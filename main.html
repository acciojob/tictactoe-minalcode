
<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <form id="player-form">
            <input type="text" id="player-1" placeholder="Player 1 Name" required>
            <input type="text" id="player-2" placeholder="Player 2 Name" required>
            <button type="submit" id="submit">Start Game</button>
        </form>

        <div id="game" hidden>
            <h1>Tic Tac Toe</h1>
            <div class="message"></div>

            <div class="board">
                <div class="cell" id="1"></div>
                <div class="cell" id="2"></div>
                <div class="cell" id="3"></div>
                <div class="cell" id="4"></div>
                <div class="cell" id="5"></div>
                <div class="cell" id="6"></div>
                <div class="cell" id="7"></div>
                <div class="cell" id="8"></div>
                <div class="cell" id="9"></div>
            </div>

            <button type="button" id="restart">Play Again</button>
        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
